version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Scheduled dependency automation replaces version-update PRs. Dependabot
    # security updates remain enabled when this limit is zero.
    open-pull-requests-limit: 0
    schedule:
      interval: "cron"
      cronjob: "0 5 2 * *" # Second day of each month at 05:00 UTC

  - package-ecosystem: "github-actions"
    directory: "/"
    # Merge only after github/blackbird excludes this repository from its
    # external combiner; the scheduled workflow then owns version updates.
    open-pull-requests-limit: 0
    schedule:
      interval: "cron"
      cronjob: "0 5 2 * *" # Second day of each month at 05:00 UTC

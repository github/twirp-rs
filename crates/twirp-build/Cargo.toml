[package]
name = "twirp-build"
version = "0.10.2"
edition = "2021"
description = "Code generation for async-compatible Twirp RPC interfaces."
readme = "README.md"
keywords = ["twirp", "prost", "protocol-buffers"]
categories = [
    "development-tools::build-utils",
    "network-programming",
    "asynchronous",
]
repository = "https://github.com/github/twirp-rs"
license = "MIT"

[dependencies]
prettyplease = "0.3"
proc-macro2 = "1.0"
prost-build = "0.14"
quote = "1.0"
syn = "3.0"
